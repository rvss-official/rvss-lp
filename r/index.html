<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>redirecting...</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1B33;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(232, 182, 87, 0.25);
    border-top-color: #E8B657;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>

<!-- ===================== 設定エリア(ここだけ編集すればOK) ===================== -->
<script>
  // GA4測定ID
  const GA_MEASUREMENT_ID = "G-88X3YDL7XR";

  // LINE公式アカウントの友だち追加URL
  // lin.ee の短縮リンクは line.me へ301リダイレクトされ、余分なパラメータが付く。
  // アプリ内ブラウザでLINEアプリが起動せずQR表示になるのを避けるため、展開後の
  // URL（DMで従来使っていたものと同一）を直接指定する。
  const LINE_URL = "https://line.me/R/ti/p/@392huviq";

  // デフォルトのキャンペーン名(URLに ?c=xxx が無い場合に使われる)
  const DEFAULT_CAMPAIGN = "default";

  // GA4 に表示する流入元の名前（URLの ?c= の値 → 表示名）。
  // 新しい流入元を増やすときは、ここに1行足してから ?c= にその英字を使う。
  // ここに無い値は、?c= の英字がそのまま表示される。
  const CAMPAIGN_LABELS = {
    "instagram_dm":    "インスタDM",
    "instagram_bio":   "インスタプロフィール",
    "instagram_story": "インスタストーリー",
    "x_bio":           "Xプロフィール",
    "default":         "流入元不明（URLに?c=なし）"
  };
</script>
<!-- ===================== 設定エリアここまで ===================== -->

<!-- Google Analytics (GA4) -->
<script>
  // URLパラメータからキャンペーン名を取得(例: ?c=2026-08 や ?c=ab-a)
  const params = new URLSearchParams(window.location.search);
  const campaign = params.get('c') || DEFAULT_CAMPAIGN;

  const ua = navigator.userAgent;

  // iPadOS 13以降の Safari は Mac と同じUAを名乗るので、タッチ対応かどうかで見分ける
  const isMobile = /iPhone|iPad|iPod|Android/i.test(ua) ||
    (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

  // DMに貼られたリンクを Instagram 側が自動で読みに来るアクセス（プレビュー生成や
  // 安全確認）を除外する。9/8〜9/15 のDM流入にはPC扱いのこうしたアクセスが混ざり、
  // 多くが米国・スウェーデン（Metaのデータセンター所在地）からだった。
  const isBot = navigator.webdriver === true ||
    /bot|crawl|spider|slurp|facebookexternalhit|facebookcatalog|facebot|meta-external|headlesschrome|lighthouse/i.test(ua);

  // 計測するのはスマホの人だけ。PCとbotはGA4を読み込まずにそのまま転送する。
  // gtag.js を読み込むだけで session_start / first_visit が記録され、
  // 訪問者数が水増しされるため、読み込み自体をしない。
  const shouldMeasure = isMobile && !isBot;

  // LINEアプリを直接起動するためのカスタムスキーム。
  // https://line.me/R/ti/p/... は Instagram等のアプリ内ブラウザだと
  // アプリ遷移がブロックされQRコード表示に落ちることがあるため、
  // スマホでは先にこちらを試す。
  const LINE_SCHEME = LINE_URL.replace(/^https:\/\/line\.me\/R\//, 'line://');

  let redirected = false;
  function goToLine() {
    if (redirected) return;
    redirected = true;

    if (!isMobile) {
      // PCにはLINEアプリが無い前提。QR表示ページへ送るしかない
      // replace にして履歴を残さない（戻る操作での再遷移を防ぐ）
      window.location.replace(LINE_URL);
      return;
    }

    // アプリ起動に失敗したときだけ https へフォールバックする。
    // 起動に成功するとページが hidden になるので、その場合は取り消す
    // （成功後にフォールバックが走るとQR画面が二重に開いてしまう）
    const fallback = setTimeout(function () {
      window.location.replace(LINE_URL);
    }, 1200);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) clearTimeout(fallback);
    });
    window.addEventListener('pagehide', function () {
      clearTimeout(fallback);
    });

    window.location.href = LINE_SCHEME;
  }

  if (!shouldMeasure) {
    goToLine();
  } else {
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());

    // GA4はページ遷移が早すぎるとPVを取りこぼすため、
    // send_page_view: false にして、イベントをbeacon方式で確実に送信する
    gtag('config', GA_MEASUREMENT_ID, { send_page_view: false });

    const tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
    document.head.appendChild(tag);

    // イベント送信。送信完了(event_callback)を待って即リダイレクトする。
    // イベント名は GA4 の画面でそのまま読めるよう日本語にしている。
    // Instagram 以外（X など）からの流入も同じイベントで記録するため、SNS全般を指す名前にする。
    // （旧名 dm_redirect → インスタからLINEへ転送。切り替え前のデータは旧名のまま別の行に残る）
    // パラメータ名は dm_campaign。GA4は campaign_name を流入元判定用の
    // 予約パラメータとして特別扱いするため、自前の値に使うと誤集計になる。
    gtag('event', 'SNSからLINEへ転送', {
      transport_type: 'beacon',
      dm_campaign: CAMPAIGN_LABELS[campaign] || campaign,
      event_callback: goToLine
    });

    // コールバックが来ない場合の保険。
    // gtag.js は async 読み込みのため、モバイル回線では読み込み完了前に
    // 遷移してしまうと dataLayer に積まれるだけで送信されない。
    // 通常は event_callback が先に発火するので、ここまで待つのは失敗時のみ。
    setTimeout(goToLine, 1500);
  }
</script>
</body>
</html>
