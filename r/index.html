<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>redirecting...</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0D1B33;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(232, 182, 87, 0.25);
    border-top-color: #E8B657;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>

<!-- ===================== 設定エリア(ここだけ編集すればOK) ===================== -->
<script>
  // GA4測定ID
  const GA_MEASUREMENT_ID = "G-88X3YDL7XR";

  // LINE公式アカウントの友だち追加URL
  // lin.ee の短縮リンクは line.me へ301リダイレクトされ、余分なパラメータが付く。
  // アプリ内ブラウザでLINEアプリが起動せずQR表示になるのを避けるため、展開後の
  // URL（DMで従来使っていたものと同一）を直接指定する。
  const LINE_URL = "https://line.me/R/ti/p/@392huviq";

  // デフォルトのキャンペーン名(URLに ?c=xxx が無い場合に使われる)
  const DEFAULT_CAMPAIGN = "default";
</script>
<!-- ===================== 設定エリアここまで ===================== -->

<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-88X3YDL7XR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());

  // GA4はページ遷移が早すぎるとPVを取りこぼすため、
  // send_page_view: false にして、イベントをbeacon方式で確実に送信する
  gtag('config', GA_MEASUREMENT_ID, { send_page_view: false });

  // URLパラメータからキャンペーン名を取得(例: ?c=2026-08 や ?c=ab-a)
  const params = new URLSearchParams(window.location.search);
  const campaign = params.get('c') || DEFAULT_CAMPAIGN;

  let redirected = false;
  function goToLine() {
    if (redirected) return;
    redirected = true;
    // replace にして履歴を残さない（LINEから「戻る」でこのページに戻り再遷移するのを防ぐ）
    window.location.replace(LINE_URL);
  }

  // イベント送信(beacon方式)。送信完了 or 300ms経過のどちらか早い方でリダイレクト
  gtag('event', 'dm_redirect', {
    transport_type: 'beacon',
    campaign_name: campaign,
    event_callback: goToLine
  });

  // コールバックが遅延・失敗した場合の保険(最大300msで強制遷移)
  setTimeout(goToLine, 300);
</script>
</body>
</html>
